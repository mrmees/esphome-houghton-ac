esphome:
  name: ac-controller
  name_add_mac_suffix: false

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Strength"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic

external_components:
  - source: github://nebulight/esphome-houghton-ac
    components: [carrier_ac128]
    refresh: 0s   # always pull latest; default caches the clone for 1 day

remote_transmitter:
  pin: GPIO2
  carrier_duty_percent: 50%
  non_blocking: True

remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO1
    mode:
      input: true
      pullup: true
    inverted: true
  idle: 30ms
  filter: 100us
  buffer_size: 10kb

time:
  - platform: homeassistant
    id: ha_time

climate:
  - platform: carrier_ac128
    id: houghton_ac
    name: "Houghton AC"
    time_id: ha_time
    receiver_id: ir_receiver

switch:
  - platform: carrier_ac128
    carrier_ac128_id: houghton_ac
    name: "Display LEDs"
