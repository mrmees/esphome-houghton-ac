esphome:
  name: ac-controller
  name_add_mac_suffix: false

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

external_components:
  - source: github://nebulight/esphome-houghton-ac
    components: [carrier_ac128]

remote_transmitter:
  pin: GPIO2
  carrier_duty_percent: 50%
  non_blocking: True

remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO1
    mode:
      input: true
      pullup: true
    inverted: true
  idle: 30ms
  filter: 100us
  buffer_size: 10kb

time:
  - platform: homeassistant
    id: ha_time

climate:
  - platform: carrier_ac128
    name: "Houghton AC"
    time_id: ha_time
    receiver_id: ir_receiver